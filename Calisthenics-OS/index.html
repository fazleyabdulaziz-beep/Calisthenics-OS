
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d120e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Calisthenics OS">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/icon-180.png">
  <meta name="description" content="Calisthenics OS — your personal training command center.">

  <title>Calisthenics OS</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Local CSS: GitHub Pages -->
  <link rel="stylesheet" href="./css/style.css">

</head>

<body>

  <!-- BOOT SCREEN -->
  <div id="boot" class="boot-screen">
    <div class="boot-mark">C<span>.</span></div>
    <div class="boot-orbit"><div class="boot-orbit-core">C<span>.</span></div></div>
    <div class="loader"><span></span></div>
    <p>BUILDING YOUR MOMENTUM</p>
    <small class="boot-caption">PREPARING YOUR TRAINING SPACE</small>
  </div>


  <!-- AUTHENTICATION -->
  <section id="authView" class="auth-wrap hidden">

    <div class="auth-brand">
      <div class="brand-mark">C<span>.</span></div>
      <div>
        <b>CALISTHENICS OS</b>
        <small>TRAIN WITH INTENTION</small>
      </div>
    </div>

    <div class="auth-card">

      <div class="eyebrow">YOUR TRAINING SPACE</div>

      <h1 id="authTitle">Welcome back.</h1>

      <p class="muted" id="authSubtitle">
        Sign in and keep your momentum.
      </p>

      <form id="authForm">

        <label>
          Username
          <input
            id="authUsername"
            autocomplete="username"
            minlength="3"
            required
            placeholder="your_username"
          >
        </label>

        <label>
          Password
          <div class="password-wrap">
            <input
              id="authPassword"
              type="password"
              autocomplete="current-password"
              minlength="8"
              required
              placeholder="At least 8 characters"
            >
            <button class="password-toggle" type="button" data-password-toggle="authPassword" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
          <small id="passwordError" class="field-error"></small>
        </label>

        <label id="confirmWrap" class="hidden">
          Confirm password
          <div class="password-wrap">
            <input
              id="authConfirm"
              type="password"
              minlength="8"
              placeholder="Repeat password"
            >
            <button class="password-toggle" type="button" data-password-toggle="authConfirm" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </label>

        <button class="btn primary full" id="authSubmit">
          Sign in <span>→</span>
        </button>

      </form>

      <p class="auth-switch">
        <span id="switchText">New here?</span>
        <button class="text-btn" id="switchAuth" type="button">
          Create account
        </button>
      </p>

      <div id="authError" class="error-text"></div>

    </div>

    <div class="auth-foot auth-controls">
      <label class="theme-control" for="themeSelectAuth">THEME
        <select id="themeSelectAuth" aria-label="Choose app theme">
          <option value="forest">Forest</option>
          <option value="ocean">Ocean</option>
          <option value="sunset">Sunset</option>
          <option value="midnight">Midnight</option>
          <option value="violet">Violet</option>
        </select>
      </label>
      <span>CONSISTENCY OVER INTENSITY.</span>
    </div>

  </section>


  <!-- APPLICATION -->
  <div id="appView" class="app-shell hidden">

    <aside class="sidebar">

      <div class="side-brand">
        <div class="brand-mark">C<span>.</span></div>
        <div>
          <b>CALISTHENICS</b>
          <small>OS / TRAINING</small>
        </div>
      </div>

      <div class="side-label">WORKSPACE</div>

      <nav id="mainNav">

        <button class="nav-item active" data-page="dashboard">
          <i>⌂</i> Dashboard
        </button>

        <button class="nav-item" data-page="routines">
          <i>▤</i> My routines
        </button>

        <button class="nav-item" data-page="workout">
          <i>◎</i> Workout log
        </button>

        <button class="nav-item" data-page="progression">
          <i>↗</i> Progression
        </button>

        <button class="nav-item" data-page="body">
          <i>⌁</i> BMI & Body weight
        </button>

        <button class="nav-item" data-page="consistency">
          <i>▥</i> Consistency
        </button>

        <button class="nav-item" data-page="history">
          <i>◷</i> History
        </button>

        <button class="nav-item" data-page="friends">
          <i>♧</i> Friends
          <span id="friendBadge" class="nav-badge hidden">0</span>
        </button>

      </nav>

      <div class="sidebar-bottom">

        <div class="mini-profile">

          <div class="avatar" id="sideAvatar">U</div>

          <div class="profile-meta">
            <b id="sideName">Athlete</b>
            <small>MEMBER</small>
          </div>

          <button id="logoutBtn" class="icon-btn" title="Log out">
            ↗
          </button>

        </div>

      </div>

    </aside>


    <main class="main-area">

      <header class="topbar">

        <button id="mobileMenu" class="icon-btn mobile-only">
          ☰
        </button>

        <div>
          <div class="eyebrow" id="topEyebrow">OVERVIEW</div>
          <div class="top-title" id="topTitle">Dashboard</div>
        </div>

        <div class="top-actions">
          <label class="theme-control app-theme-control" for="themeSelect" title="Choose colour theme">
            <span class="theme-label">THEME</span>
            <select id="themeSelect" aria-label="Choose app theme">
              <option value="forest">Forest</option>
              <option value="ocean">Ocean</option>
              <option value="sunset">Sunset</option>
              <option value="midnight">Midnight</option>
              <option value="violet">Violet</option>
            </select>
          </label>
          <button id="installAppBtn" class="btn secondary install-btn" type="button">
            <span aria-hidden="true">↓</span> Install app
          </button>
          <span class="live-dot"></span>
          <span class="muted tiny sync-label">SYNCED</span>
          <div class="avatar small" id="topAvatar">U</div>
        </div>

      </header>

      <div id="pageContent" class="page-content"></div>

    </main>

  </div>


  <!-- GLOBAL UI -->
  <div id="toast" class="toast"></div>
  <div id="modalRoot"></div>


  <!-- JAVASCRIPT -->
  <script src="./js/config.js" defer></script>
  <script src="./js/app.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(error => {
          console.warn('Service worker registration failed:', error);
        });
      });
    }
  </script>

</body>
</html>
